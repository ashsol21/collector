<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault.OS - Firebase Cloud Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        :root {
            --neon-blue: #6366f1;
            --bg-dark: #020617;
        }
        body { 
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.05) 0%, transparent 50%);
        }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .sidebar-item.active { background: linear-gradient(90deg, rgba(99, 102, 241, 0.2) 0%, transparent 100%); color: #818cf8; border-left: 3px solid #6366f1; }
        .tech-font { font-family: 'JetBrains Mono', monospace; }
        .loading-overlay { background: rgba(2, 6, 23, 0.9); z-index: 1000; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        #drop-zone.dragover { border-color: #6366f1; background: rgba(99, 102, 241, 0.1); }
    </style>
</head>
<body class="text-slate-300 min-h-screen flex">

    <!-- 系統通知彈窗 -->
    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 glass px-6 py-3 rounded-full text-xs tech-font tracking-widest text-indigo-400 z-[999] opacity-0 transition-opacity pointer-events-none border border-indigo-500/30">
        SYSTEM_NOTIFICATION
    </div>

    <!-- 載入中遮罩 -->
    <div id="loading" class="hidden fixed inset-0 flex flex-col items-center justify-center loading-overlay">
        <div class="w-16 h-16 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mb-4"></div>
        <p id="loading-text" class="tech-font tracking-widest text-indigo-400 uppercase">Initializing_Secure_Vault...</p>
    </div>

    <!-- 左側側邊欄 -->
    <aside class="w-72 glass border-r border-white/5 flex flex-col h-screen sticky top-0 z-50">
        <div class="p-8">
            <div class="flex items-center gap-4 mb-2">
                <div class="w-10 h-10 bg-indigo-600 rounded-lg flex items-center justify-center text-white shadow-[0_0_20px_rgba(79,70,229,0.4)]">
                    <i class="fas fa-database"></i>
                </div>
                <h1 class="text-xl font-bold tracking-widest text-white">VAULT<span class="text-indigo-500">.DB</span></h1>
            </div>
            <p class="text-[10px] text-slate-500 tech-font">FIRESTORE_SECURE_MODE</p>
        </div>

        <div class="px-6 py-2 flex justify-between items-center text-[10px] font-bold text-slate-500 uppercase tracking-widest">
            <span>分類區塊 / SECTORS</span>
            <button onclick="document.getElementById('addCategoryModal').classList.remove('hidden')" class="hover:text-indigo-400 transition">
                <i class="fas fa-plus-circle text-xs"></i>
            </button>
        </div>

        <nav class="flex-1 px-4 space-y-1 overflow-y-auto no-scrollbar">
            <button onclick="filterByCategory('全部')" id="btn-filter-all" class="sidebar-item active w-full flex items-center justify-between px-4 py-3 rounded-xl text-sm font-medium transition-all group">
                <span class="flex items-center gap-3"><i class="fas fa-layer-group"></i> 全部節點</span>
                <span class="text-[10px] tech-font opacity-40" id="total-count-badge">0</span>
            </button>
            <div id="category-list" class="pt-2 space-y-1"></div>
        </nav>

        <div class="p-6 border-t border-white/5">
            <div id="auth-section">
                <button id="googleSignInBtn" class="w-full py-3 text-xs font-bold uppercase tracking-widest bg-white/5 hover:bg-indigo-500/20 text-indigo-400 rounded-xl transition border border-indigo-500/30 flex items-center justify-center gap-2">
                    <i class="fab fa-google"></i> Google 登入
                </button>
            </div>
            <div id="user-profile" class="hidden flex items-center gap-3 p-3 bg-indigo-500/5 rounded-xl border border-indigo-500/20">
                <div class="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center text-white font-bold" id="user-initial">U</div>
                <div class="flex-1 overflow-hidden">
                    <p class="text-[10px] font-bold text-slate-200 truncate tech-font" id="user-email">...</p>
                    <button id="signOutBtn" class="text-[8px] text-red-400 hover:text-red-300 uppercase tracking-tighter">Sign_Out</button>
                </div>
            </div>
        </div>
    </aside>

    <!-- 主要內容 -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        <header class="glass border-b border-white/5 px-10 py-6 flex items-center justify-between">
            <div class="relative w-full max-w-md">
                <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-indigo-500 text-xs"></i>
                <input type="text" id="searchInput" oninput="renderCollections()" placeholder="SEARCH_VAULT..." 
                    class="w-full bg-white/5 border border-white/10 rounded-full py-2 px-12 text-sm focus:border-indigo-500 transition tech-font text-white outline-none">
            </div>
            <div class="flex items-center gap-4">
                <span class="text-[10px] tech-font text-slate-500 uppercase">Records: <span id="filtered-count" class="text-indigo-400">0</span></span>
                <button onclick="openAddItemModal()" class="bg-indigo-600 text-white px-6 py-2.5 rounded-full font-bold text-sm hover:bg-indigo-500 transition shadow-[0_0_20px_rgba(79,70,229,0.3)]">
                    + NEW_RECORD
                </button>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-10 no-scrollbar">
            <div id="collection-container" class="grid grid-cols-1 xl:grid-cols-2 gap-4"></div>
            <div id="empty-state" class="hidden flex flex-col items-center justify-center py-40">
                <i class="fas fa-database text-slate-800 text-4xl mb-4"></i>
                <p class="text-xs tech-font text-slate-600 uppercase tracking-widest">No_Access_or_Empty</p>
            </div>
        </div>
    </main>

    <!-- Modal 結構 -->
    <div id="addItemModal" class="hidden fixed inset-0 z-[200] flex items-center justify-center p-4 bg-black/90 backdrop-blur-xl">
        <div class="glass rounded-[2rem] w-full max-w-5xl overflow-hidden border border-white/10 shadow-2xl flex flex-col lg:flex-row max-h-[90vh]">
            <div class="flex-1 p-10 overflow-y-auto no-scrollbar border-r border-white/5">
                <div class="mb-8"><h3 class="text-xl font-bold text-white tech-font uppercase">Add_To_Vault</h3></div>
                <div class="space-y-6">
                    <div class="group">
                        <label class="block text-[10px] text-slate-500 tech-font mb-2 uppercase">Image (Base64)</label>
                        <div id="drop-zone" class="relative w-full h-40 border-2 border-dashed border-white/10 rounded-2xl flex flex-col items-center justify-center cursor-pointer transition-all hover:border-indigo-500/50">
                            <input type="file" id="fileInput" accept="image/*" class="hidden">
                            <div id="drop-zone-content" class="text-center">
                                <i class="fas fa-upload text-2xl text-indigo-500/50 mb-2"></i>
                                <p class="text-[10px] text-slate-400 tech-font">拖放或點擊上傳圖片</p>
                            </div>
                            <img id="image-preview-thumbnail" class="hidden absolute inset-0 w-full h-full object-cover rounded-2xl opacity-50">
                        </div>
                    </div>
                    <div class="group">
                        <label class="block text-[10px] text-slate-500 tech-font mb-2 uppercase">Label</label>
                        <input type="text" id="itemName" oninput="updatePreview()" placeholder="輸入名稱..." class="w-full bg-white/5 border border-white/10 rounded-2xl py-3 px-5 text-white outline-none focus:border-indigo-500">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-[10px] text-slate-500 tech-font mb-2 uppercase">Category</label>
                            <select id="itemCategory" onchange="updatePreview()" class="w-full bg-white/5 border border-white/10 rounded-2xl py-3 px-5 text-white outline-none appearance-none"></select>
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-500 tech-font mb-2 uppercase">Value</label>
                            <input type="number" id="itemValue" oninput="updatePreview()" placeholder="0" class="w-full bg-white/5 border border-white/10 rounded-2xl py-3 px-5 text-white outline-none">
                        </div>
                    </div>
                    <div class="flex gap-4 pt-4">
                        <button onclick="document.getElementById('addItemModal').classList.add('hidden')" class="flex-1 bg-white/5 text-slate-400 py-4 rounded-2xl font-bold tech-font hover:bg-white/10 transition uppercase">Cancel</button>
                        <button onclick="saveNewItem()" class="flex-[2] bg-indigo-600 text-white py-4 rounded-2xl font-bold tech-font hover:bg-indigo-500 transition uppercase">Upload_to_Firestore</button>
                    </div>
                </div>
            </div>
            <div class="w-full lg:w-80 bg-white/5 p-10 flex flex-col justify-center items-center">
                <div id="live-preview" class="w-full glass rounded-2xl overflow-hidden border border-indigo-500/30">
                    <div class="w-full h-40 bg-white/5 flex items-center justify-center overflow-hidden">
                        <img id="preview-img-display" class="hidden w-full h-full object-cover">
                        <i class="fas fa-image text-3xl text-indigo-500/20" id="preview-placeholder"></i>
                    </div>
                    <div class="p-4">
                        <span id="preview-cat" class="text-[8px] tech-font text-indigo-400 border border-indigo-500/30 px-1.5 py-0.5 rounded uppercase">CATEGORY</span>
                        <h4 id="preview-name" class="font-bold text-white mt-1 truncate">未命名</h4>
                        <p id="preview-value" class="text-emerald-400 text-xs mt-1 tech-font">$0</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 新增分類 Modal -->
    <div id="addCategoryModal" class="hidden fixed inset-0 z-[201] flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
        <div class="glass rounded-3xl w-full max-w-sm overflow-hidden border border-white/10">
            <div class="p-6 border-b border-white/5 flex justify-between items-center">
                <h3 class="text-xs font-bold text-white tech-font uppercase">New_Sector</h3>
                <button onclick="document.getElementById('addCategoryModal').classList.add('hidden')" class="text-slate-500 hover:text-white"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-8 space-y-4">
                <input type="text" id="newCategoryName" placeholder="分類名稱..." class="w-full bg-black/40 border border-white/10 rounded-xl py-3 px-4 text-white outline-none focus:border-indigo-500">
                <button onclick="saveNewCategory()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold tech-font hover:bg-indigo-500 transition">ADD</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signInAnonymously, signOut, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, query, onSnapshot, addDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

        const firebaseConfig = JSON.parse('{"apiKey":"AIzaSyAcZj2VlLMH289GbaQEJetmxx5-L20hjrc","authDomain":"collector-e9a62.firebaseapp.com","projectId":"collector-e9a62","storageBucket":"collector-e9a62.firebasestorage.app","messagingSenderId":"208614853835","appId":"1:208614853835:web:ca2201e05ba940201f1f4e"}');

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'collector-app';

        // 核心狀態
        let user = null;
        let collections = [];
        let categories = ["攝影器材", "腕錶", "集換式卡牌", "藝術品", "其他"];
        let currentFilter = '全部';
        let currentSelectedImage = null;
        let unsubscribeItems = null;

        // 初始化
        window.addEventListener('DOMContentLoaded', async () => {
            toggleLoading(true, "Securing_Connection...");
            initImageEvents();
            await initAuth();
        });

        // --- 修正後的 Auth 流程 ---
        async function initAuth() {
            // 監聽狀態
            onAuthStateChanged(auth, async (u) => {
                if (u) {
                    user = u;
                    await handleUserIn();
                } else {
                    user = null;
                    handleUserOut();
                }
            });

            // 觸發登入
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (e) {
                console.error("Auth init failed:", e);
                // 如果 custom token 失敗，嘗試匿名登入作為備援
                try { await signInAnonymously(auth); } catch(e2) {}
            }
        }

        async function handleUserIn() {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('user-profile').classList.remove('hidden');
            
            const isAnonymous = user.isAnonymous;
            document.getElementById('user-email').innerText = isAnonymous ? `ID: ${user.uid.substring(0,8)}...` : user.email;
            document.getElementById('user-initial').innerText = isAnonymous ? "?" : (user.email ? user.email[0].toUpperCase() : "U");
            
            // 先同步分類資料，再啟動監聽項目
            await syncCategories();
            subscribeToData();
            toggleLoading(false);
            showToast("DATA_SYNC_ACTIVE");
        }

        function handleUserOut() {
            if (unsubscribeItems) unsubscribeItems();
            document.getElementById('auth-section').classList.remove('hidden');
            document.getElementById('user-profile').classList.add('hidden');
            collections = [];
            renderAll();
            toggleLoading(false);
        }

        // --- 修正後的 Firestore 監聽器 (RULE 1, 2, 3) ---
        function subscribeToData() {
            // 再次檢查 User 存在，這是避免 Permission Error 的關鍵
            if (!user) {
                console.warn("Attempted to subscribe without User context.");
                return;
            }
            
            if (unsubscribeItems) unsubscribeItems();

            // 嚴格遵守路徑：/artifacts/{appId}/users/{userId}/items
            const itemsRef = collection(db, 'artifacts', appId, 'users', user.uid, 'items');
            
            // 使用簡單查詢以避免 index 需求
            unsubscribeItems = onSnapshot(itemsRef, (snapshot) => {
                collections = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderAll();
            }, (error) => {
                console.error("Snapshot Error:", error);
                if (error.code === 'permission-denied') {
                    showToast("PERM_DENIED: Check Auth State");
                }
            });
        }

        async function syncCategories() {
            if (!user) return;
            // 路徑：/artifacts/{appId}/users/{userId}/settings/categories
            const catDocRef = doc(db, 'artifacts', appId, 'users', user.uid, 'settings', 'categories');
            try {
                const snap = await getDoc(catDocRef);
                if (snap.exists()) {
                    categories = snap.data().list || categories;
                } else {
                    await setDoc(catDocRef, { list: categories });
                }
            } catch (e) {
                console.error("Category Sync Error:", e);
            }
        }

        // --- 功能函數 ---
        window.saveNewCategory = async function() {
            const name = document.getElementById('newCategoryName').value.trim();
            if(!name || !user) return;
            
            if(!categories.includes(name)) {
                categories.push(name);
                try {
                    const catDocRef = doc(db, 'artifacts', appId, 'users', user.uid, 'settings', 'categories');
                    await setDoc(catDocRef, { list: categories });
                    document.getElementById('addCategoryModal').classList.add('hidden');
                    document.getElementById('newCategoryName').value = '';
                    renderAll();
                    showToast("SECTOR_ADDED");
                } catch(e) {
                    showToast("UPDATE_FAILED");
                }
            }
        };

        window.saveNewItem = async function() {
            const name = document.getElementById('itemName').value;
            if(!name || !user) return showToast("INVALID_INPUT");

            toggleLoading(true, "Storing_Encrypted_Data...");
            try {
                const itemData = {
                    name,
                    category: document.getElementById('itemCategory').value,
                    value: parseInt(document.getElementById('itemValue').value) || 0,
                    image: currentSelectedImage, 
                    timestamp: serverTimestamp(),
                    date: new Date().toLocaleDateString()
                };

                const itemsCol = collection(db, 'artifacts', appId, 'users', user.uid, 'items');
                await addDoc(itemsCol, itemData);
                
                document.getElementById('addItemModal').classList.add('hidden');
                resetForm();
                showToast("ITEM_VAULTED");
            } catch (error) {
                console.error("Save Error:", error);
                showToast("SAVE_ERROR");
            } finally {
                toggleLoading(false);
            }
        };

        window.deleteItem = async function(docId) {
            if(!user) return;
            try {
                const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'items', docId);
                await deleteDoc(docRef);
                showToast("ENTRY_DELETED");
            } catch (error) {
                showToast("DELETE_FAILED");
            }
        };

        // --- UI 渲染 ---
        function renderAll() {
            renderSidebar();
            renderCollections();
            updateCategoryDropdown();
        }

        function renderSidebar() {
            const container = document.getElementById('category-list');
            const totalBadge = document.getElementById('total-count-badge');
            if (totalBadge) totalBadge.innerText = collections.length;
            
            if (container) {
                container.innerHTML = categories.map(cat => {
                    const count = collections.filter(i => i.category === cat).length;
                    return `
                        <button onclick="filterByCategory('${cat}')" class="sidebar-item ${currentFilter === cat ? 'active' : ''} w-full flex items-center justify-between px-4 py-2.5 rounded-xl text-xs font-medium transition-all group">
                            <span class="flex items-center gap-3"><i class="fas fa-tag opacity-30"></i> ${cat}</span>
                            <span class="tech-font opacity-40">${count}</span>
                        </button>
                    `;
                }).join('');
            }
        }

        window.renderCollections = function() {
            const container = document.getElementById('collection-container');
            const search = document.getElementById('searchInput').value.toLowerCase();
            
            let filtered = collections.filter(i => {
                const matchesSearch = i.name?.toLowerCase().includes(search);
                const matchesCat = currentFilter === '全部' || i.category === currentFilter;
                return matchesSearch && matchesCat;
            });

            const filteredCount = document.getElementById('filtered-count');
            if (filteredCount) filteredCount.innerText = filtered.length;
            
            const emptyState = document.getElementById('empty-state');
            if (emptyState) emptyState.classList.toggle('hidden', filtered.length > 0 || !user);

            if (container) {
                container.innerHTML = filtered.map(item => `
                    <div class="glass rounded-2xl p-4 border border-white/5 hover:border-indigo-500/30 transition group flex items-center gap-4">
                        <div class="w-16 h-16 bg-white/5 rounded-xl overflow-hidden flex items-center justify-center shrink-0">
                            ${item.image ? `<img src="${item.image}" class="w-full h-full object-cover">` : `<i class="fas fa-cube text-xl text-indigo-500/20"></i>`}
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-2 mb-0.5">
                                <span class="text-[8px] tech-font text-indigo-400 border border-indigo-500/20 px-1 py-0.5 rounded uppercase">${item.category}</span>
                                <h4 class="font-bold text-white text-sm truncate">${item.name}</h4>
                            </div>
                            <div class="flex items-center gap-4 text-[10px] text-slate-500 tech-font">
                                <span class="text-emerald-500 font-bold">$${(item.value || 0).toLocaleString()}</span>
                                <span class="opacity-30">${item.date || ''}</span>
                            </div>
                        </div>
                        <button onclick="deleteItem('${item.id}')" class="opacity-0 group-hover:opacity-100 p-2 text-slate-600 hover:text-red-400 transition">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                `).join('');
            }
        }

        // --- 圖片處理 ---
        function initImageEvents() {
            const dropZone = document.getElementById('drop-zone');
            const fileInput = document.getElementById('fileInput');
            if (dropZone && fileInput) {
                dropZone.onclick = () => fileInput.click();
                fileInput.onchange = (e) => handleFile(e.target.files[0]);
                dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('dragover'); };
                dropZone.ondragleave = () => dropZone.classList.remove('dragover');
                dropZone.ondrop = (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); handleFile(e.dataTransfer.files[0]); };
            }
        }

        function handleFile(file) {
            if(!file || !file.type.startsWith('image/')) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                currentSelectedImage = e.target.result;
                document.getElementById('image-preview-thumbnail').src = currentSelectedImage;
                document.getElementById('image-preview-thumbnail').classList.remove('hidden');
                document.getElementById('preview-img-display').src = currentSelectedImage;
                document.getElementById('preview-img-display').classList.remove('hidden');
                document.getElementById('preview-placeholder').classList.add('hidden');
            };
            reader.readAsDataURL(file);
        }

        window.updatePreview = function() {
            document.getElementById('preview-name').innerText = document.getElementById('itemName').value || '未命名';
            document.getElementById('preview-cat').innerText = document.getElementById('itemCategory').value || 'CATEGORY';
            document.getElementById('preview-value').innerText = '$' + (parseInt(document.getElementById('itemValue').value) || 0).toLocaleString();
        }

        function updateCategoryDropdown() {
            const el = document.getElementById('itemCategory');
            if (el) el.innerHTML = categories.map(c => `<option value="${c}">${c}</option>`).join('');
        }

        window.filterByCategory = function(cat) {
            currentFilter = cat;
            renderAll();
        }

        function resetForm() {
            document.getElementById('itemName').value = '';
            document.getElementById('itemValue').value = '';
            currentSelectedImage = null;
            document.getElementById('image-preview-thumbnail').classList.add('hidden');
            document.getElementById('preview-img-display').classList.add('hidden');
            document.getElementById('preview-placeholder').classList.remove('hidden');
        }

        function toggleLoading(show, text = "") {
            const el = document.getElementById('loading');
            const txt = document.getElementById('loading-text');
            if (txt) txt.innerText = text;
            if (el) el.classList.toggle('hidden', !show);
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            if (t) {
                t.innerText = msg;
                t.style.opacity = '1';
                setTimeout(() => t.style.opacity = '0', 3000);
            }
        }

        // 登入事件
        document.getElementById('googleSignInBtn').onclick = async () => {
            toggleLoading(true, "Google_Auth_In_Progress...");
            const provider = new GoogleAuthProvider();
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                showToast("AUTH_ERROR");
            } finally {
                toggleLoading(false);
            }
        };

        document.getElementById('signOutBtn').onclick = async () => {
            await signOut(auth);
            location.reload();
        };

    </script>
</body>
</html>
