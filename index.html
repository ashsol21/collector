<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault.OS - Google Cloud Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        :root {
            --neon-blue: #6366f1;
            --bg-dark: #020617;
        }
        body { 
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.05) 0%, transparent 50%);
        }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .sidebar-item.active { background: linear-gradient(90deg, rgba(99, 102, 241, 0.2) 0%, transparent 100%); color: #818cf8; border-left: 3px solid #6366f1; }
        .tech-font { font-family: 'JetBrains Mono', monospace; }
        .loading-overlay { background: rgba(2, 6, 23, 0.9); z-index: 1000; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .input-glow:focus { box-shadow: 0 0 15px rgba(99, 102, 241, 0.2); border-color: rgba(99, 102, 241, 0.5); }
        #drop-zone.dragover { border-color: #6366f1; background: rgba(99, 102, 241, 0.1); }
    </style>
</head>
<body class="text-slate-300 min-h-screen flex">

    <!-- 系統通知彈窗 -->
    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 glass px-6 py-3 rounded-full text-xs tech-font tracking-widest text-indigo-400 z-[999] opacity-0 transition-opacity pointer-events-none border border-indigo-500/30">
        SYSTEM_NOTIFICATION
    </div>

    <!-- 詢問視窗 (Custom Modal) -->
    <div id="confirmModal" class="hidden fixed inset-0 z-[1000] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
        <div class="glass p-8 rounded-3xl w-full max-w-sm border border-white/10 text-center">
            <i class="fas fa-exclamation-triangle text-amber-500 text-3xl mb-4"></i>
            <h3 class="text-white font-bold mb-2">確認刪除分類？</h3>
            <p id="confirmMessage" class="text-xs text-slate-400 mb-6 leading-relaxed">該分類下的所有項目將被移至「未分類」。</p>
            <div class="flex gap-4">
                <button id="cancelConfirm" class="flex-1 py-3 bg-white/5 rounded-xl text-xs font-bold tech-font">CANCEL</button>
                <button id="executeConfirm" class="flex-1 py-3 bg-red-500/20 text-red-400 border border-red-500/30 rounded-xl text-xs font-bold tech-font">DELETE</button>
            </div>
        </div>
    </div>

    <!-- 載入中遮罩 -->
    <div id="loading" class="hidden fixed inset-0 flex flex-col items-center justify-center loading-overlay">
        <div class="w-16 h-16 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mb-4"></div>
        <p id="loading-text" class="tech-font tracking-widest text-indigo-400 uppercase">Syncing_with_Cloud...</p>
    </div>

    <!-- 左側側邊欄 -->
    <aside class="w-72 glass border-r border-white/5 flex flex-col h-screen sticky top-0 z-50">
        <div class="p-8">
            <div class="flex items-center gap-4 mb-2">
                <div class="w-10 h-10 bg-indigo-600 rounded-lg flex items-center justify-center text-white shadow-[0_0_20px_rgba(79,70,229,0.4)]">
                    <i class="fas fa-cloud"></i>
                </div>
                <h1 class="text-xl font-bold tracking-widest text-white">VAULT<span class="text-indigo-500">.GS</span></h1>
            </div>
            <p class="text-[10px] text-slate-500 tech-font">CLOUD_SYNC_ENABLED</p>
        </div>

        <div class="px-6 py-2 flex justify-between items-center text-[10px] font-bold text-slate-500 uppercase tracking-widest">
            <span>系統分類 / SECTORS</span>
            <button onclick="showAddCategoryModal()" class="hover:text-indigo-400 transition">
                <i class="fas fa-plus-circle text-xs"></i>
            </button>
        </div>

        <nav class="flex-1 px-4 space-y-1 overflow-y-auto no-scrollbar" id="category-list-nav">
            <button onclick="filterByCategory('全部')" id="btn-filter-all" class="sidebar-item active w-full flex items-center justify-between px-4 py-3 rounded-xl text-sm font-medium transition-all group">
                <span class="flex items-center gap-3"><i class="fas fa-layer-group"></i> 全部節點</span>
                <span class="text-[10px] tech-font opacity-40" id="total-count-badge">0</span>
            </button>
            <div id="category-list" class="pt-2 space-y-1"></div>
        </nav>

        <div class="p-6 border-t border-white/5">
            <div id="auth-section">
                <button onclick="handleAuthClick()" class="w-full py-3 text-xs font-bold uppercase tracking-widest bg-white/5 hover:bg-indigo-500/20 text-indigo-400 rounded-xl transition border border-indigo-500/30 flex items-center justify-center gap-2">
                    <i class="fab fa-google"></i> 登入雲端同步
                </button>
            </div>
            <div id="user-profile" class="hidden flex items-center gap-3 p-3 bg-indigo-500/5 rounded-xl border border-indigo-500/20">
                <div class="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center text-white font-bold" id="user-initial">U</div>
                <div class="flex-1 overflow-hidden">
                    <p class="text-[10px] font-bold text-slate-200 truncate tech-font" id="user-email">USER@CLOUD</p>
                    <button onclick="handleSignoutClick()" class="text-[8px] text-red-400 hover:text-red-300 uppercase tracking-tighter">Sign_Out</button>
                </div>
                <button onclick="syncData(true)" class="text-indigo-400 hover:rotate-180 transition-transform duration-500">
                    <i class="fas fa-sync-alt text-xs"></i>
                </button>
            </div>
        </div>
    </aside>

    <!-- 主要內容 -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        <header class="glass border-b border-white/5 px-10 py-6 flex items-center justify-between">
            <div class="relative w-full max-w-md">
                <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-indigo-500 text-xs"></i>
                <input type="text" id="searchInput" oninput="renderCollections()" placeholder="SEARCH_VAULT..." 
                    class="w-full bg-white/5 border border-white/10 rounded-full py-2 px-12 text-sm focus:border-indigo-500 transition tech-font text-white outline-none">
            </div>
            <div class="flex items-center gap-4">
                <span class="text-[10px] tech-font text-slate-500 uppercase">Found: <span id="filtered-count" class="text-indigo-400">0</span></span>
                <button onclick="showAddItemModal()" class="bg-indigo-600 text-white px-6 py-2.5 rounded-full font-bold text-sm hover:bg-indigo-500 transition shadow-[0_0_20px_rgba(79,70,229,0.3)]">
                    + NEW_RECORD
                </button>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-10 no-scrollbar">
            <div id="collection-container" class="grid grid-cols-1 xl:grid-cols-2 gap-4"></div>
            <div id="empty-state" class="hidden flex flex-col items-center justify-center py-40">
                <i class="fas fa-database text-slate-800 text-4xl mb-4"></i>
                <p class="text-xs tech-font text-slate-600 uppercase tracking-widest">Vault_Empty</p>
            </div>
        </div>
    </main>

    <!-- 新增項目 Modal -->
    <div id="addItemModal" class="hidden fixed inset-0 z-[200] flex items-center justify-center p-4 bg-black/90 backdrop-blur-xl">
        <div class="glass rounded-[2rem] w-full max-w-5xl overflow-hidden border border-white/10 shadow-2xl flex flex-col lg:flex-row max-h-[90vh]">
            <div class="flex-1 p-10 overflow-y-auto no-scrollbar border-r border-white/5">
                <div class="mb-8"><h3 class="text-xl font-bold text-white tech-font uppercase">Add_To_Vault</h3></div>
                <div class="space-y-6">
                    <div class="group">
                        <label class="block text-[10px] text-slate-500 tech-font mb-2 uppercase">Image_Data</label>
                        <div id="drop-zone" class="relative w-full h-40 border-2 border-dashed border-white/10 rounded-2xl flex flex-col items-center justify-center cursor-pointer transition-all hover:border-indigo-500/50">
                            <input type="file" id="fileInput" accept="image/*" class="hidden">
                            <div id="drop-zone-content" class="text-center">
                                <i class="fas fa-upload text-2xl text-indigo-500/50 mb-2"></i>
                                <p class="text-[10px] text-slate-400 tech-font">拖放或點擊上傳圖片</p>
                            </div>
                            <img id="image-preview-thumbnail" class="hidden absolute inset-0 w-full h-full object-cover rounded-2xl opacity-50">
                        </div>
                    </div>
                    <div class="group">
                        <label class="block text-[10px] text-slate-500 tech-font mb-2 uppercase">Label</label>
                        <input type="text" id="itemName" oninput="updatePreview()" placeholder="輸入名稱..." class="w-full bg-white/5 border border-white/10 rounded-2xl py-3 px-5 text-white outline-none focus:border-indigo-500">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-[10px] text-slate-500 tech-font mb-2 uppercase">Category</label>
                            <select id="itemCategory" onchange="updatePreview()" class="w-full bg-white/5 border border-white/10 rounded-2xl py-3 px-5 text-white outline-none appearance-none"></select>
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-500 tech-font mb-2 uppercase">Value</label>
                            <input type="number" id="itemValue" oninput="updatePreview()" placeholder="0" class="w-full bg-white/5 border border-white/10 rounded-2xl py-3 px-5 text-white outline-none">
                        </div>
                    </div>
                    <div class="flex gap-4 pt-4">
                        <button onclick="hideAddItemModal()" class="flex-1 bg-white/5 text-slate-400 py-4 rounded-2xl font-bold tech-font hover:bg-white/10 transition uppercase">Cancel</button>
                        <button id="commitBtn" onclick="saveNewItem()" class="flex-[2] bg-indigo-600 text-white py-4 rounded-2xl font-bold tech-font hover:bg-indigo-500 transition uppercase">Save_Record</button>
                    </div>
                </div>
            </div>
            <!-- 預覽區 -->
            <div class="w-full lg:w-80 bg-white/5 p-10 flex flex-col justify-center items-center">
                <div id="live-preview" class="w-full glass rounded-2xl overflow-hidden border border-indigo-500/30">
                    <div class="w-full h-40 bg-white/5 flex items-center justify-center overflow-hidden">
                        <img id="preview-img-display" class="hidden w-full h-full object-cover">
                        <i class="fas fa-image text-3xl text-indigo-500/20" id="preview-placeholder"></i>
                    </div>
                    <div class="p-4">
                        <span id="preview-cat" class="text-[8px] tech-font text-indigo-400 border border-indigo-500/30 px-1.5 py-0.5 rounded uppercase">CATEGORY</span>
                        <h4 id="preview-name" class="font-bold text-white mt-1 truncate">未命名</h4>
                        <p id="preview-value" class="text-emerald-400 text-xs mt-1 tech-font">$0</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 新增分類 Modal -->
    <div id="addCategoryModal" class="hidden fixed inset-0 z-[201] flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
        <div class="glass rounded-3xl w-full max-w-sm overflow-hidden border border-white/10">
            <div class="p-6 border-b border-white/5 flex justify-between items-center">
                <h3 class="text-xs font-bold text-white tech-font uppercase">New_Sector</h3>
                <button onclick="hideAddCategoryModal()" class="text-slate-500 hover:text-white"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-8 space-y-4">
                <input type="text" id="newCategoryName" placeholder="分類名稱..." class="w-full bg-black/40 border border-white/10 rounded-xl py-3 px-4 text-white outline-none focus:border-indigo-500">
                <button onclick="saveNewCategory()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold tech-font hover:bg-indigo-500 transition">ADD</button>
            </div>
        </div>
    </div>

    <script>
        // --- 設定 (Google API) ---
        // 請確保您已在 Google Cloud Console 啟動 Google Drive API，並將網址加入授權來源
        const SCOPES = 'https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/userinfo.email';
        let tokenClient;
        let accessToken = null;
        let currentUserEmail = null;

        // --- 狀態 ---
        let collections = [];
        let categories = ["數位收藏", "實體資產", "加密貨幣"];
        let currentFilter = '全部';
        let currentSelectedImage = null;

        // --- 初始化 ---
        window.onload = () => {
            loadLocalData();
            initGoogleAuth();
            initImageEvents();
            renderAll();
        };

        function loadLocalData() {
            const data = localStorage.getItem('vault_v3_data');
            const cats = localStorage.getItem('vault_v3_categories');
            if(data) collections = JSON.parse(data);
            if(cats) categories = JSON.parse(cats);
        }

        // --- Google Auth 邏輯 ---
        function initGoogleAuth() {
            try {
                // 如果您是從本地測試，請務必填寫有效的 Client ID
                tokenClient = google.accounts.oauth2.initTokenClient({
                    client_id: '86161491147-3q4j9f2r7o1g0i0t7q8r9g9v8f8f8f8f.apps.googleusercontent.com', // 範例格式，請替換
                    scope: SCOPES,
                    callback: (tokenResponse) => {
                        if (tokenResponse.error !== undefined) {
                            console.error("Google Auth Error:", tokenResponse);
                            // 如果彈窗被手動關閉，tokenResponse.error 會是 "popup_closed_by_user"
                            if (tokenResponse.error === 'popup_closed_by_user') {
                                showToast("驗證視窗已關閉，請重試");
                            } else {
                                showToast("登入錯誤: " + tokenResponse.error);
                            }
                            toggleLoading(false);
                            return;
                        }
                        accessToken = tokenResponse.access_token;
                        afterLogin();
                    },
                    error_callback: (err) => {
                        console.error("Initialization Error:", err);
                        // 這是捕捉 Popup window closed 的關鍵點
                        if (err.type === 'popup_closed') {
                            showToast("視窗意外關閉，請重新點擊登入");
                        }
                        toggleLoading(false);
                    }
                });
            } catch (err) {
                console.error("Google SDK Load Error:", err);
            }
        }

        function handleAuthClick() {
            if (!tokenClient) {
                // 如果初始化失敗，嘗試重新載入
                initGoogleAuth();
                if (!tokenClient) return showToast("SDK 初始化失敗，請檢查網路或 Client ID");
            }
            
            try {
                // 請求存取權杖
                tokenClient.requestAccessToken({prompt: 'consent'});
            } catch (e) {
                console.error("Request Token Error:", e);
                showToast("開啟登入視窗失敗，請檢查是否被瀏覽器攔截");
            }
        }

        function handleSignoutClick() {
            if (accessToken) {
                google.accounts.oauth2.revoke(accessToken, () => {
                    accessToken = null;
                    currentUserEmail = null;
                    document.getElementById('auth-section').classList.remove('hidden');
                    document.getElementById('user-profile').classList.add('hidden');
                    showToast("SIGNED_OUT");
                });
            }
        }

        async function afterLogin() {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('user-profile').classList.remove('hidden');
            
            try {
                const resp = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                const info = await resp.json();
                currentUserEmail = info.email;
                document.getElementById('user-email').innerText = info.email;
                document.getElementById('user-initial').innerText = info.email[0].toUpperCase();
                showToast(`WELCOME_${info.given_name || 'USER'}`);
                syncData();
            } catch (e) {
                console.error(e);
            }
        }

        // --- 雲端同步核心 ---
        async function syncData(forceUpload = false) {
            if (!accessToken) return;
            toggleLoading(true, "Syncing_Vault...");

            try {
                const listResp = await fetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name='vault_sync.json'`, {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                const listData = await listResp.json();
                const file = listData.files[0];

                if (file && !forceUpload) {
                    const contentResp = await fetch(`https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`, {
                        headers: { 'Authorization': `Bearer ${accessToken}` }
                    });
                    const cloudData = await contentResp.json();
                    if (cloudData.collections) collections = cloudData.collections;
                    if (cloudData.categories) categories = cloudData.categories;
                    saveLocal();
                    renderAll();
                    showToast("CLOUD_DATA_RESTORED");
                } else {
                    await uploadToCloud(file ? file.id : null);
                    showToast("LOCAL_SYNCED_TO_CLOUD");
                }
            } catch (e) {
                console.error(e);
                showToast("SYNC_FAILED");
            } finally {
                toggleLoading(false);
            }
        }

        async function uploadToCloud(fileId = null) {
            if(!accessToken) return;
            
            if(!fileId) {
                const listResp = await fetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name='vault_sync.json'`, {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                const listData = await listResp.json();
                if(listData.files && listData.files.length > 0) fileId = listData.files[0].id;
            }

            const metadata = { name: 'vault_sync.json', parents: ['appDataFolder'] };
            const data = { collections, categories };
            const boundary = 'foo_bar_baz';
            const delimiter = "\r\n--" + boundary + "\r\n";
            const close_delim = "\r\n--" + boundary + "--";

            const multipartRequestBody =
                delimiter + 'Content-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(metadata) +
                delimiter + 'Content-Type: application/json\r\n\r\n' + JSON.stringify(data) +
                close_delim;

            const url = fileId 
                ? `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=multipart`
                : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
            
            await fetch(url, {
                method: fileId ? 'PATCH' : 'POST',
                headers: {
                    'Authorization': `Bearer ${accessToken}`,
                    'Content-Type': `multipart/related; boundary=${boundary}`
                },
                body: multipartRequestBody
            });
        }

        // --- 渲染系統 ---
        function renderAll() {
            renderSidebar();
            renderCollections();
            updateCategoryDropdown();
        }

        function renderSidebar() {
            const container = document.getElementById('category-list');
            document.getElementById('total-count-badge').innerText = collections.length;
            
            container.innerHTML = categories.map(cat => {
                const count = collections.filter(i => i.category === cat).length;
                return `
                    <div class="group flex items-center gap-1 sidebar-item ${currentFilter === cat ? 'active' : ''} rounded-xl transition-all pr-2">
                        <button onclick="filterByCategory('${cat}')" class="flex-1 flex items-center justify-between px-4 py-2.5 text-xs font-medium">
                            <span class="flex items-center gap-3"><i class="fas fa-folder-open opacity-30"></i> ${cat}</span>
                            <span class="tech-font opacity-40">${count}</span>
                        </button>
                        <button onclick="confirmDeleteCategory('${cat}')" class="opacity-0 group-hover:opacity-100 p-2 text-slate-600 hover:text-red-400 transition-opacity">
                            <i class="fas fa-times text-[10px]"></i>
                        </button>
                    </div>
                `;
            }).join('');
        }

        function renderCollections() {
            const container = document.getElementById('collection-container');
            const search = document.getElementById('searchInput').value.toLowerCase();
            
            let filtered = collections.filter(i => {
                const matchesSearch = i.name.toLowerCase().includes(search);
                const matchesCat = currentFilter === '全部' || i.category === currentFilter;
                return matchesSearch && matchesCat;
            });

            document.getElementById('filtered-count').innerText = filtered.length;
            document.getElementById('empty-state').classList.toggle('hidden', filtered.length > 0);

            container.innerHTML = filtered.map(item => `
                <div class="glass rounded-2xl p-4 border border-white/5 hover:border-indigo-500/30 transition group flex items-center gap-4">
                    <div class="w-16 h-16 bg-white/5 rounded-xl overflow-hidden flex items-center justify-center shrink-0">
                        ${item.image ? `<img src="${item.image}" class="w-full h-full object-cover">` : `<i class="fas fa-cube text-xl text-indigo-500/20"></i>`}
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2 mb-0.5">
                            <span class="text-[8px] tech-font text-indigo-400 border border-indigo-500/20 px-1 py-0.5 rounded uppercase">${item.category || '未分類'}</span>
                            <h4 class="font-bold text-white text-sm truncate">${item.name}</h4>
                        </div>
                        <div class="flex items-center gap-4 text-[10px] text-slate-500 tech-font">
                            <span class="text-emerald-500 font-bold">$${item.value.toLocaleString()}</span>
                            <span class="opacity-30">${item.date}</span>
                        </div>
                    </div>
                    <button onclick="deleteItem(${item.id})" class="opacity-0 group-hover:opacity-100 p-2 text-slate-600 hover:text-red-400 transition">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </div>
            `).join('');
        }

        // --- 分類刪除邏輯 ---
        let categoryToDelete = null;
        function confirmDeleteCategory(cat) {
            categoryToDelete = cat;
            const count = collections.filter(i => i.category === cat).length;
            const msg = count > 0 
                ? `此分類含有 ${count} 個項目。刪除後，這些項目將會被歸類為「未分類」。` 
                : `確定要移除「${cat}」分類嗎？`;
            
            document.getElementById('confirmMessage').innerText = msg;
            document.getElementById('confirmModal').classList.remove('hidden');
        }

        document.getElementById('cancelConfirm').onclick = () => {
            document.getElementById('confirmModal').classList.add('hidden');
            categoryToDelete = null;
        };

        document.getElementById('executeConfirm').onclick = () => {
            if(!categoryToDelete) return;
            collections = collections.map(item => {
                if(item.category === categoryToDelete) return { ...item, category: '未分類' };
                return item;
            });
            categories = categories.filter(c => c !== categoryToDelete);
            if(currentFilter === categoryToDelete) currentFilter = '全部';

            saveLocal();
            renderAll();
            if (accessToken) uploadToCloud();
            document.getElementById('confirmModal').classList.add('hidden');
            showToast("CATEGORY_REMOVED");
            categoryToDelete = null;
        };

        // --- 核心操作 ---
        async function saveNewItem() {
            const name = document.getElementById('itemName').value;
            if(!name) return showToast("NAME_REQUIRED");

            const newItem = {
                id: Date.now(),
                name,
                category: document.getElementById('itemCategory').value,
                value: parseInt(document.getElementById('itemValue').value) || 0,
                image: currentSelectedImage,
                date: new Date().toLocaleDateString()
            };

            collections.unshift(newItem);
            saveLocal();
            renderAll();
            hideAddItemModal();
            resetForm();
            if (accessToken) uploadToCloud();
        }

        function deleteItem(id) {
            collections = collections.filter(i => i.id !== id);
            saveLocal();
            renderAll();
            if (accessToken) uploadToCloud();
        }

        function saveLocal() {
            localStorage.setItem('vault_v3_data', JSON.stringify(collections));
            localStorage.setItem('vault_v3_categories', JSON.stringify(categories));
        }

        // --- 輔助功能 ---
        function initImageEvents() {
            const dropZone = document.getElementById('drop-zone');
            const fileInput = document.getElementById('fileInput');
            dropZone.onclick = () => fileInput.click();
            fileInput.onchange = (e) => handleFile(e.target.files[0]);
            dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('dragover'); };
            dropZone.ondragleave = () => dropZone.classList.remove('dragover');
            dropZone.ondrop = (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); handleFile(e.dataTransfer.files[0]); };
        }

        function handleFile(file) {
            if(!file || !file.type.startsWith('image/')) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                currentSelectedImage = e.target.result;
                document.getElementById('image-preview-thumbnail').src = currentSelectedImage;
                document.getElementById('image-preview-thumbnail').classList.remove('hidden');
                document.getElementById('preview-img-display').src = currentSelectedImage;
                document.getElementById('preview-img-display').classList.remove('hidden');
                document.getElementById('preview-placeholder').classList.add('hidden');
            };
            reader.readAsDataURL(file);
        }

        function updatePreview() {
            document.getElementById('preview-name').innerText = document.getElementById('itemName').value || '未命名';
            document.getElementById('preview-cat').innerText = document.getElementById('itemCategory').value || 'CATEGORY';
            document.getElementById('preview-value').innerText = '$' + (parseInt(document.getElementById('itemValue').value) || 0).toLocaleString();
        }

        function updateCategoryDropdown() {
            document.getElementById('itemCategory').innerHTML = categories.map(c => `<option value="${c}">${c}</option>`).join('');
        }

        function filterByCategory(cat) {
            currentFilter = cat;
            document.getElementById('btn-filter-all').classList.toggle('active', cat === '全部');
            renderAll();
        }

        function showAddItemModal() { document.getElementById('addItemModal').classList.remove('hidden'); }
        function hideAddItemModal() { document.getElementById('addItemModal').classList.add('hidden'); }
        function showAddCategoryModal() { document.getElementById('addCategoryModal').classList.remove('hidden'); }
        function hideAddCategoryModal() { document.getElementById('addCategoryModal').classList.add('hidden'); }

        function saveNewCategory() {
            const name = document.getElementById('newCategoryName').value.trim();
            if(name && !categories.includes(name)) {
                categories.push(name);
                saveLocal();
                renderAll();
                hideAddCategoryModal();
                document.getElementById('newCategoryName').value = '';
                if (accessToken) uploadToCloud();
            }
        }

        function resetForm() {
            document.getElementById('itemName').value = '';
            document.getElementById('itemValue').value = '';
            currentSelectedImage = null;
            document.getElementById('image-preview-thumbnail').classList.add('hidden');
            document.getElementById('preview-img-display').classList.add('hidden');
            document.getElementById('preview-placeholder').classList.remove('hidden');
        }

        function toggleLoading(show, text = "") {
            const el = document.getElementById('loading');
            document.getElementById('loading-text').innerText = text;
            el.classList.toggle('hidden', !show);
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.opacity = '1';
            setTimeout(() => t.style.opacity = '0', 3000);
        }
    </script>
</body>
</html>
